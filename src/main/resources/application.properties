spring.application.name=video_sharing_platform
spring.config.import=optional:file:./.local/application.properties
app.jwt.secret=${JWT_SECRET}
app.jwt.ttl=${JWT_TTL:PT8H}
server.port=${SERVER_PORT:5454}

# PostgreSQL must already contain the database named by DB_NAME.
# Hibernate creates or updates tables inside that database.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:video_sharing_website_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
